<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free AI Image Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 110px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #475569;
            background: #0b0f19;
            color: #fff;
            font-size: 1rem;
            resize: none;
            margin-bottom: 20px;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        .generate-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            color: white;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .generate-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .result-box {
            margin-top: 25px;
            min-height: 280px;
            border: 2px dashed #475569;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0b0f19;
            padding: 15px;
        }
        .result-box img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }
        .download-btn {
            display: none;
            padding: 12px 24px;
            background: #10b981;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }
        .download-btn:hover {
            background: #059669;
        }
        .loader {
            display: none;
            border: 4px solid #1e293b;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎨 Free AI Image Generator</h1>
        <p>Kisi bhi bhasha mein apna vichar likhein aur AI Image banayein!</p>

        <textarea id="promptInput" placeholder="Jaise: Ek sundar rajkumari, a cute cat in space, ya 3D cartoon style robot..."></textarea>
        
        <button class="generate-btn" onclick="generateImage()">Generate HD Image</button>

        <div class="result-box" id="resultBox">
            <div class="loader" id="loader"></div>
            <span id="placeholderText" style="color: #64748b;">Aapki AI Image yahan dikhegi...</span>
            <a id="downloadBtn" class="download-btn" target="_blank">📥 Download HD Image</a>
        </div>
    </div>

    <script>
        async function generateImage() {
            const prompt = document.getElementById('promptInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const loader = document.getElementById('loader');
            const placeholderText = document.getElementById('placeholderText');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!prompt) {
                alert('Kripya pehle kuch prompt likhein!');
                return;
            }

            placeholderText.style.display = 'none';
            downloadBtn.style.display = 'none';
            const oldImg = resultBox.querySelector('img');
            if(oldImg) oldImg.remove();
            
            loader.style.display = 'block';

            // Random seed logic to prevent caching issues and speed up load
            const randomSeed = Math.floor(Math.random() * 999999);
            const encodedPrompt = encodeURIComponent(prompt);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?seed=${randomSeed}&width=1024&height=1024&nologo=true`;

            const img = new Image();
            img.src = imageUrl;

            img.onload = function() {
                loader.style.display = 'none';
                resultBox.insertBefore(img, downloadBtn);
                
                downloadBtn.href = imageUrl;
                downloadBtn.style.display = 'inline-block';
            };

            img.onerror = function() {
                loader.style.display = 'none';
                placeholderText.innerText = "Server busy hai, please 5 second baad dobara koshish karein.";
                placeholderText.style.display = 'block';
            };
        }
    </script>
</body>
</html>
