<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free AI Video & Image Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e293b; padding: 20px; border-radius: 10px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; }
        input { background: #334155; color: #fff; }
        button { background: #3b82f6; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background: #2563eb; }
        #result img { max-width: 100%; margin-top: 15px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 Free AI Generator</h2>
        <p>Apna prompt likhein aur AI content banayein!</p>
        
        <input type="text" id="prompt" placeholder="Jaise: A cute cat flying in space...">
        <button onclick="generateImage()">Generate Image / Art</button>
        
        <div id="result"></div>
    </div>

    <script>
        function generateImage() {
            const promptText = document.getElementById('prompt').value;
            if(!promptText) {
                alert('Pehle kuch prompt toh likhein!');
                return;
            }
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = "<p>Generating, kripya intezaar karein...</p>";
            
            const encodedPrompt = encodeURIComponent(promptText);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}`;
            
            setTimeout(() => {
                resultDiv.innerHTML = `<img src="${imageUrl}" alt="AI Generated Image">`;
            }, 1000);
        }
    </script>

</body>
</html>
