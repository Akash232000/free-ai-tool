<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartoon AI Studio - Free AI Creation Platform</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #090d16, #1e1b4b);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 5px;
            background: linear-gradient(to right, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tagline {
            text-align: center;
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 1.05rem;
            color: #38bdf8;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .formats, .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .format-btn, .tab-btn {
            flex: 1;
            padding: 10px;
            background: #1e293b;
            border: 1px solid #475569;
            color: #cbd5e1;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9rem;
        }
        .format-btn.active, .tab-btn.active {
            background: linear-gradient(135deg, #0284c7, #7c3aed);
            border-color: #38bdf8;
            color: #fff;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }
        textarea {
            width: 100%;
            height: 110px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #475569;
            background: #0b0f19;
            color: #fff;
            font-size: 1rem;
            resize: none;
            margin-bottom: 20px;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }
        .generate-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #059669, #10b981);
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
        .generate-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }
        .result-box {
            margin-top: 25px;
            min-height: 280px;
            border: 2px dashed #475569;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0b0f19;
            padding: 15px;
            position: relative;
            overflow: hidden;
        }
        .result-box img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            margin-bottom: 15px;
        }
        .download-btn {
            display: none;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 10px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }
        .download-btn:hover {
            background: #1d4ed8;
        }
        .loader {
            display: none;
            border: 4px solid #1e293b;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 Cartoon AI Studio</h1>
        <div class="tagline">Create Stories. Bring Characters to Life.</div>

        <div class="section-title">Select Format:</div>
        <div class="formats">
            <button class="format-btn active" onclick="setFormat(1024, 1024, this)">1:1 Square</button>
            <button class="format-btn" onclick="setFormat(1280, 720, this)">16:9 Landscape</button>
            <button class="format-btn" onclick="setFormat(720, 1280, this)">9:16 Story/Reels</button>
        </div>

        <div class="section-title">Enter Prompt (Any Language):</div>
        <textarea id="promptInput" placeholder="Jaise: 3D cute cartoon cat flying in space, vibrant colors, cinematic lighting..."></textarea>
        
        <button class="generate-btn" onclick="generateArt()">Generate Cartoon Art</button>

        <div class="result-box" id="resultBox">
            <div class="loader" id="loader"></div>
            <span id="placeholderText" style="color: #64748b;">Aapka creation yahan dikhega...</span>
            <a id="downloadBtn" class="download-btn" target="_blank">📥 Download Creation</a>
        </div>
    </div>

    <script>
        let imgWidth = 1024;
        let imgHeight = 1024;

        function setFormat(w, h, btn) {
            imgWidth = w;
            imgHeight = h;
            document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function generateArt() {
            const prompt = document.getElementById('promptInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const loader = document.getElementById('loader');
            const placeholderText = document.getElementById('placeholderText');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!prompt) {
                alert('Kripya pehle kuch prompt likhein!');
                return;
            }

            placeholderText.style.display = 'none';
            downloadBtn.style.display = 'none';
            const oldImg = resultBox.querySelector('img');
            if(oldImg) oldImg.remove();
            
            loader.style.display = 'block';

            const randomSeed = Math.floor(Math.random() * 999999);
            const encodedPrompt = encodeURIComponent("3d cartoon style " + prompt);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?seed=${randomSeed}&width=${imgWidth}&height=${imgHeight}&nologo=true`;

            const img = new Image();
            img.src = imageUrl;

            img.onload = function() {
                loader.style.display = 'none';
                resultBox.insertBefore(img, downloadBtn);
                
                downloadBtn.href = imageUrl;
                downloadBtn.style.display = 'inline-block';
            };

            img.onerror = function() {
                loader.style.display = 'none';
                placeholderText.innerText = "Server busy hai, please 5 second baad dobara koshish karein.";
                placeholderText.style.display = 'block';
            };
        }
    </script>
</body>
</html>
